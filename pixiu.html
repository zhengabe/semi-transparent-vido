<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>貔貅视频</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw;
            height: 100vh;
            background: #000;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* 保持视频比例，不变形 */
        }
    </style>
</head>
<body>
    <video 
        id="myVideo"
        muted
        loop
        playsinline
        webkit-playsinline="true"
        x5-playsinline="true"
        x5-video-player-type="h5"
        preload="auto"
    >
        <!-- 多格式兼容：优先mp4，备用webm/ogg -->
        <source src="pixiu.mp4" type="video/mp4">
        <source src="pixiu.webm" type="video/webm">
        <source src="pixiu.ogg" type="video/ogg">
        您的浏览器不支持视频播放，请升级浏览器。
    </video>

    <script>
        const video = document.getElementById('myVideo');
        let hasPlayed = false;

        // 统一播放触发逻辑：电脑自动播，手机需交互
        function tryPlay() {
            if (hasPlayed) return;
            video.play().then(() => {
                hasPlayed = true;
            }).catch(err => {
                console.log('需用户交互才能播放:', err);
            });
        }

        // 电脑端：页面加载后自动播放
        if (!/Mobile|Android|iPhone|iPad/i.test(navigator.userAgent)) {
            window.addEventListener('load', tryPlay);
        } else {
            // 手机端：触摸/点击屏幕后播放
            document.addEventListener('touchstart', tryPlay, { once: true });
            document.addEventListener('click', tryPlay, { once: true });
        }
    </script>
</body>
</html>
